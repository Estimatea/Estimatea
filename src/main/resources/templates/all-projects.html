<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimatea – Active Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<style>
    /* ── PROJECT CARD ── */
    main {
        min-height: calc(100vh - 160px);
        margin: 0 auto;
    }

    .project-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        padding: 18px 22px 14px;
        margin-bottom: 16px;
        position: relative;
    }

    .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 6px;
    }

    .project-name {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--text-dark);
        letter-spacing: 0.5px;
    }

    .project-meta-right {
        text-align: right;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--text-mid);
        line-height: 1.5;
    }

    .card-info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-mid);
        font-weight: 500;
        letter-spacing: 0.3px;
    }

    .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-mid);
    }

    .value {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-dark);
    }

    .info-pair {
        display: flex;
        flex-direction: column;
        gap: 1px;
    }

    /* ── PROGRESS BAR ── */
    .progress-bar-wrap {
        margin-top: 14px;
        height: 6px;
        background: var(--bar-bg);
        border-radius: 3px;
        overflow: hidden;
    }

    .progress-bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
        width: 0%;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-light);
        font-size: 14px;
        letter-spacing: 0.5px;
    }


    /* --- FORM ---- */
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 16px;
    }

    .form-group:last-child {
        margin-bottom: 0;
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="date"] {
        background: var(--bar-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        padding: 8px 10px;
        font-family: 'Barlow', sans-serif;
        font-size: 13px;
        color: var(--text-dark);
        width: 260px;
        outline: none;
    }

    .form-group input:focus {
        border-color: var(--accent);
    }

    .btn-save {
        margin-top: 20px;
        width: 260px;
        background-color: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        padding: 12px;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    .btn-save:hover {
        opacity: 0.85;
    }
</style>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

<main>
    <div class="action-bar">
        <a th:href="@{/projects/create}" class="btn-action">
            <span class="icon">+</span> Start New Project
        </a>
    </div>

    <h1 class="section-title">Active Projects</h1>

    <div th:if="${projectList != null and !#lists.isEmpty(projectList)}">
        <div class="project-card" th:each="project : ${projectList}" th:if="${!project.completed}">
            <div class="card-top">
                <div>
                    <div class="project-name" th:text="${project.projectName}">Project Name</div>
                    <div style="margin-top:4px;">
                        <span class="label">Estimated Price:&nbsp;</span>
                        <span class="value" th:text="${project.sumPrice != 0 ? project.sumPrice + ' kr.' : '–'}">–</span>
                    </div>
                </div>
                <div class="project-meta-right">
                    <div>Project Lead</div>
                    <div th:each="employee : ${employeeList}"
                         th:if="${employee.employeeId == project.projectManager}"
                         th:text="${employee.getEmployeeName()}">–</div>
                </div>
            </div>

            <div class="card-info-row">
                <div class="info-pair">
                    <span class="label">Start-Date</span>
                    <span class="value" th:text="${#temporals.format(project.startDate, 'dd/MM/yyyy')}">–</span>
                </div>
                <div class="info-pair" style="text-align:right;">
                    <span class="label">Deadline</span>
                    <span class="value" th:text="${project.deadLine != null ? #temporals.format(project.deadLine, 'dd/MM/yyyy') : '–'}">–</span>
                </div>
            </div>

            <div class="progress-bar-wrap">
                <div class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${projectList == null or #lists.isEmpty(projectList)}">
        No active projects found.
    </div>
</main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
