<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>
    <div class="action-bar-nav">
        <a th:href="@{/projects/{projectId}(projectId=${project.projectId})}" class="btn-back">← Cancel & Return</a>
    </div>

    <h1 class="section-title">Edit Project</h1>

    <form th:action="@{/projects/{projectId}/edit/save(projectId=${project.projectId})}" th:object="${project}" method="post">

        <div class="form-group">
            <label for="projectName" class="label">Project Name</label>
            <div class="input-wrapper">
                <input type="text" id="projectName" th:field="*{projectName}" placeholder="Project name" required />
            </div>
        </div>

        <div class="form-group">
            <label for="projectManager" class="label">Project Manager (Employee ID)</label>
            <div class="input-wrapper">
                <input type="number" id="projectManager" th:field="*{projectManager}" placeholder="Employee ID" />
            </div>
        </div>

        <div class="form-group">
            <label for="startDate" class="label">Start Date</label>
            <div class="input-wrapper">
                <input type="date" id="startDate" th:field="*{startDate}" />
            </div>
        </div>

        <div class="form-group">
            <label for="deadLine" class="label">Deadline</label>
            <div class="input-wrapper">
                <input type="date" id="deadLine" th:field="*{deadLine}" />
            </div>
        </div>

        <button type="submit" class="btn-save">Save Changes</button>

    </form>

        <div class="completion-zone">
            <form th:action="@{/projects/{projectId}/complete(projectId=${project.projectId})}" method="post">
                <button type="submit" class="btn-complete"
                        onclick="return confirm('Are you sure you want to mark this project as completed?');">
                    ✓ Complete Project
                </button>
            </form>
        </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
