<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<style>
    .login-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        width: 100%;
    }

    .login-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1e2a2a;
        color: white;
        width: 90px;
        height: 90px;
    }

    .login-logo img {
        width: 60px;
        height: 60px;
        object-fit: contain;
    }

    .login-logo small {
        font-size: 9px;
        color: #aaa;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .login-container {
        background-color: white;
        padding: 40px;
        border-radius: 4px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 420px;
    }

    .login-container h1 {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 24px;
        font-weight: 700;
        text-transform: uppercase;
        color: #1e2a2a;
        margin-bottom: 28px;
        text-align: center;
        letter-spacing: 1px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
    }

    .form-group label {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #555;
        margin-bottom: 6px;
    }

    .form-group input {
        width: 100%;
        padding: 10px 14px;
        font-family: 'Barlow', sans-serif;
        font-size: 14px;
        border: 1px solid #d6d6d6;
        border-radius: 2px;
        background-color: #f9f9f9;
        color: #333;
        outline: none;
        transition: border-color 0.2s;
    }

    .form-group input:focus {
        border-color: #1e2a2a;
        background-color: white;
    }

    .error-message {
        background-color: #fdecea;
        color: #c0392b;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 2px;
        margin-bottom: 20px;
        text-align: center;
    }

    .form-actions {
        display: flex;
        justify-content: center;
        margin-top: 10px;
    }

    .btn-save {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #1e2a2a;
        color: white;
        border: none;
        padding: 12px 48px;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .btn-save:hover {
        background-color: #2d3e3e;
    }
</style>

<main>
<div class="login-wrapper">

        <div class="login-logo">
            <img th:src="@{/images/estimatea-logo.png}" alt="Estimatea Logo"/>
        </div>

        <div class="error-message" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/employee/login}" method="post">
            <div class="form-group">
                <label for="employeeUsername">Username</label>
                <input type="username" id="employeeUsername" name="email" placeholder="Employee_username" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Login</button>
            </div>
        </form>
</div>
</main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
