<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimatea – Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f6;
            font-family: 'Barlow', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            min-height: calc(100vh - 80px);
            width: 100%;
            box-sizing: border-box;
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 420px;
            background-color: white;
            padding: 40px;
            border-radius: 6px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1e2a2a;
            color: white;
            width: 110px;
            height: 90px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .login-logo img {
            width: 90px;
            height: 120px;
            object-fit: contain;
        }

        .login-wrapper h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            color: #1e2a2a;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 1px;
            margin-top: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            width: 100%;
        }

        .form-group label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100% !important;
            padding: 10px 14px;
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            border: 1px solid #d6d6d6;
            border-radius: 4px;
            background-color: #f9f9f9;
            color: #333;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .form-group input:focus {
            border-color: #1e2a2a;
            background-color: white;
        }

        .error-message {
            background-color: #fdecea;
            color: #c0392b;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 4px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            font-weight: 500;
        }

        .form-actions {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            width: 100%;
        }

        .btn-save {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #1e2a2a;
            color: white;
            border: none;
            width: 100% !important;
            padding: 12px 48px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-save:hover {
            background-color: #2d3e3e;
        }

        form {
            width: 100%;
        }
    </style>
</head>
<body>

<main>
    <div class="login-wrapper">

        <div class="login-logo">
            <img th:src="@{/images/estimatea-logo.png}" alt="Estimatea Logo"/>
        </div>

        <h1>Sign In</h1>

        <div class="error-message" th:if="${loginError}" th:text="${loginError}">
            Invalid username or password credentials.
        </div>

        <form th:action="@{/employee/login}" method="post">

            <div class="form-group">
                <label for="employeeUsername">Username</label>
                <input type="text" id="employeeUsername" name="employeeUsername" placeholder="Employee_username" required />
            </div>

            <div class="form-group">
                <label for="employeePassword">Password</label>
                <input type="password" id="employeePassword" name="employeePassword" placeholder="••••••••" required />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Login</button>
            </div>

        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
