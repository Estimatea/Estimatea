<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Employee from Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <div class="page-content">
        <h1>Remove Employee from Project</h1>

        <form th:action="@{/employee/remove/{projectId}(projectId=${projectId})}" method="post">

            <div class="form-group">
                <label for="employeeId">Select Employee</label>
                <div class="input-wrapper">
                    <select id="employeeId" name="employeeId" required>
                        <option value="" disabled selected>Choose an employee...</option>
                        <option th:each="emp : ${employeeList}"
                                th:value="${emp.employeeId}"
                                th:text="${emp.employeeName + ' (ID: ' + emp.employeeId + ')'}">
                        </option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-save">Remove from Project</button>

        </form>
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
