<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<style>
    .form-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 40px;
        background-color: white;
        border-radius: 4px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .form-container h1 {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 28px;
        font-weight: 700;
        text-transform: uppercase;
        color: #1e2a2a;
        margin-bottom: 30px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
    }

    .form-group label {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #555;
        margin-bottom: 6px;
    }

    .input-wrapper input[type="text"],
    .input-wrapper input[type="number"],
    .input-wrapper input[type="date"] {
        width: 100%;
        padding: 10px 14px;
        font-family: 'Barlow', sans-serif;
        font-size: 14px;
        border: 1px solid #d6d6d6;
        border-radius: 2px;
        background-color: #f9f9f9;
        color: #333;
        outline: none;
        transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
        border-color: #1e2a2a;
        background-color: white;
    }

    .checkbox-wrapper {
        display: flex;
        align-items: center;
        height: 40px;
    }

    .checkbox-wrapper input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #1e2a2a;
    }

    .form-actions {
        display: flex;
        justify-content: center;
        margin-top: 20px;
    }

    .btn-save {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #1e2a2a;
        color: white;
        border: none;
        padding: 12px 32px;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .btn-save:hover {
        background-color: #2d3e3e;
    }
</style>

<div class="form-container">
    <h1>Create Project</h1>

    <form th:action="@{/projects/create/save}" th:object="${project}" method="post">

        <div class="form-group">
            <label for="startDate">Start Date</label>
            <div class="input-wrapper">
                <input type="date" id="startDate" th:field="*{startDate}" />
            </div>
        </div>

        <div class="form-group">
            <label for="projectName">Name</label>
            <div class="input-wrapper">
                <input type="text" id="projectName" th:field="*{projectName}" placeholder="Project name" />
            </div>
        </div>

        <div class="form-group">
            <label for="completed">Completed</label>
            <div class="input-wrapper checkbox-wrapper">
                <input type="checkbox" id="completed" th:field="*{completed}" />
            </div>
        </div>

        <div class="form-group">
            <label for="sumTime">Sum Time</label>
            <div class="input-wrapper">
                <input type="number" id="sumTime" th:field="*{sumTime}" placeholder="Total hours" />
            </div>
        </div>

        <div class="form-group">
            <label for="sumPrice">Sum Price</label>
            <div class="input-wrapper">
                <input type="number" id="sumPrice" th:field="*{sumPrice}" placeholder="Total price" />
            </div>
        </div>

        <div class="form-group">
            <label for="deadLine">Deadline</label>
            <div class="input-wrapper">
                <input type="date" id="deadLine" th:field="*{deadLine}" />
            </div>
        </div>

        <div class="form-group">
            <label for="projectManager">Project Manager</label>
            <div class="input-wrapper">
                <input type="number" id="projectManager" th:field="*{projectManager}" placeholder="Employee ID" />
            </div>
        </div>

            <div th:action="@{/projects/create/save}" th:object="${project}" method="post">
                <button type="submit" class="btn-save">Save</button>
            </div>

    </form>
</div>

</body>
</html>
