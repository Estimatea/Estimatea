<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
</head>
<body>
        <h1 th:text="${errorDto != null ? errorDto.status : 'Error'}"></h1>
        <p th:text="${errorDto!= null ? errorDto.message : 'Unknown Error'}"></p>
        <p th:text="${errorDto != null ? errorDto.timeStamp : ''}"></p>
</body>
</html>
